<!doctype html><meta charset="utf-8"><title>demo host</title>
<style>
body{margin:0;background:#f4f1ec;font:15px system-ui,sans-serif;color:#222}
#wrap{display:grid;grid-template-columns:1fr 600px;gap:28px;padding:108px 34px 26px;height:100vh;box-sizing:border-box}
#left{min-width:0;overflow:hidden}h3{margin:14px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#777}
#prompt{background:#fff;border-radius:14px;padding:14px 16px;font-size:18px;line-height:1.4;margin:0;box-shadow:0 1px 3px #0002}
pre{background:#1d1f24;color:#d7dae0;border-radius:12px;padding:12px 14px;margin:0;font:12px/1.45 ui-monospace,Menlo,monospace;overflow:hidden;white-space:pre-wrap}
#tool{color:#6ed1a5}#ms{color:#999;font-size:12px;margin-left:8px}
iframe{width:600px;height:calc(100vh - 134px);border:1px solid #d8d2c8;border-radius:16px;background:#fff}
</style>
<div id="wrap"><div id="left"><h3>User asks</h3><p id="prompt"></p>
<h3>Model calls the tool <span id="tool"></span><span id="ms"></span></h3><pre id="args"></pre>
<h3>Tool returns (text for the model; the widget gets the same result)</h3><pre id="res"></pre></div>
<iframe id="w" title="widget"></iframe></div><script src="/host.js"></script>
